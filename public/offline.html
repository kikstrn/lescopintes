<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#0b1f15"
    />

    <title>Hors connexion — Les Co’Pintes</title>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #06130d;
        color: #f3fff8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 22px;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(94, 228, 155, 0.11),
            transparent 34%
          ),
          linear-gradient(
            145deg,
            #0a2418,
            #04100a
          );
      }

      main {
        width: min(
          520px,
          100%
        );
        padding: 28px;
        border: 1px solid
          rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background:
          rgba(7, 25, 16, 0.92);
        box-shadow:
          0 30px 90px
            rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .icon {
        width: 78px;
        height: 78px;
        display: block;
        margin: 0 auto;
        border-radius: 22px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.34);
      }

      h1 {
        margin:
          18px 0 0;
        font-size: 1.35rem;
      }

      p {
        margin:
          10px auto 0;
        color:
          rgba(243, 255, 248, 0.67);
        font-size: 0.92rem;
        line-height: 1.65;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 20px;
        border: 1px solid
          rgba(94, 228, 155, 0.26);
        border-radius: 14px;
        color: #06130d;
        background:
          linear-gradient(
            135deg,
            #89f4bd,
            #5ee49b
          );
        font-size: 0.95rem;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <main>
      <img
        class="icon"
        src="/android-chrome-192x192.png"
        alt="Logo Les Co’Pintes"
      />

      <h1>
        Pas de connexion Internet
      </h1>

      <p>
        Les Co’Pintes n’arrive pas à charger cette page pour le moment. Vérifie ta connexion puis réessaie.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        Réessayer
      </button>
    </main>
  </body>
</html>
